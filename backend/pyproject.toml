[project]
name = "home-aid-backend"
version = "1.0.0"
description = "API for managing home aid kits with multi-user households"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.1",
    "celery==5.3.4",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.6",
    "httpx==0.25.2",
    "pydantic[email]==2.5.1",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "selectolax==0.3.17",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "chardet==5.2.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
]

[tool.uv]
package = false
