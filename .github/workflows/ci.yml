name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_aid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_aid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The barcode tests drop and recreate the schema in this database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_aid_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          # Keep in sync with the uv version pinned in backend/Dockerfile.
          version: "0.8.17"
          python-version: "3.11"

      - name: Check uv.lock is up to date
        working-directory: backend
        run: uv lock --check

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run barcode tests
        run: backend/.venv/bin/python -m pytest tests/services/test_medication_barcode.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Same major version as frontend/Dockerfile (node:24-alpine).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` also runs `tsc`, which still reports pre-existing type
      # errors, so only the Vite build is checked here.
      - name: Build
        run: npx vite build

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build backend frontend

      # Run the backend the way docker-compose.yml does: bind-mounted source,
      # Postgres, Redis and the Celery worker
      - name: Start backend services
        run: docker compose up -d postgres redis backend worker

      - name: Check the backend starts and keeps the schema up to date
        run: |
          wait_for_backend() {
            for _ in $(seq 60); do
              if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "backend did not start"
            return 1
          }
          query() {
            docker compose exec -T postgres psql -U postgres -d home_aid_kit -tAc "$1"
          }
          check_barcode_schema() {
            test "$(query "SELECT column_name FROM information_schema.columns WHERE table_name = 'medications' AND column_name = 'barcode'")" = barcode
            test "$(query "SELECT indexname FROM pg_indexes WHERE indexname = 'uq_medications_household_barcode'")" = uq_medications_household_barcode
          }

          wait_for_backend
          check_barcode_schema

          # A database from before barcodes existed gets the column and index on restart
          query "ALTER TABLE medications DROP COLUMN barcode"
          docker compose restart backend
          wait_for_backend
          check_barcode_schema

      - name: Check the Celery worker connects to Redis
        run: |
          for _ in $(seq 30); do
            if docker compose exec -T worker celery -A app.worker.celery inspect ping >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "worker did not respond"
          exit 1

      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
