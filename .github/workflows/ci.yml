name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_aid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_aid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The barcode tests drop and recreate the schema in this database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_aid_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          # Keep in sync with the uv version pinned in backend/Dockerfile.
          version: "0.8.17"
          python-version: "3.11"

      - name: Check uv.lock is up to date
        working-directory: backend
        run: uv lock --check

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run barcode tests
        run: backend/.venv/bin/python -m pytest tests/services/test_medication_barcode.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Same major version as frontend/Dockerfile (node:18-alpine).
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` also runs `tsc`, which still reports pre-existing type
      # errors, so only the Vite build is checked here.
      - name: Build
        run: npx vite build
